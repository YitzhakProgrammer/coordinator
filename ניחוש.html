<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>משחק ניחוש מספרים</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #e3f2fd; padding-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 10px; font-size: 16px; border: 2px solid #ddd; border-radius: 5px; width: 60px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>נחשו את המספר!</h1>
    <p>בחרתי מספר בין 1 ל-100. האם תצליחו לנחש אותו?</p>
    
    <input type="number" id="guessInput" min="1" max="100">
    <button onclick="checkGuess()">בדוק ניחוש</button>

    <div id="message"></div>
    <button id="resetBtn" style="display:none; margin-top:10px;" onclick="resetGame()">משחק חדש</button>
</div>

<script>
    let randomNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    function checkGuess() {
        const guess = document.getElementById("guessInput").value;
        const message = document.getElementById("message");
        const resetBtn = document.getElementById("resetBtn");
        attempts++;

        if (guess == randomNumber) {
            message.innerHTML = `כל הכבוד! ניחשתם נכון את המספר ${randomNumber} תוך ${attempts} נסיונות!`;
            message.style.color = "green";
            resetBtn.style.display = "inline-block";
        } else if (guess > randomNumber) {
            message.innerHTML = "גבוה מדי! נסו מספר נמוך יותר.";
            message.style.color = "orange";
        } else if (guess < randomNumber) {
            message.innerHTML = "נמוך מדי! נסו מספר גבוה יותר.";
            message.style.color = "orange";
        }
    }

    function resetGame() {
        randomNumber = Math.floor(Math.random() * 100) + 1;
        attempts = 0;
        document.getElementById("message").innerHTML = "";
        document.getElementById("guessInput").value = "";
        document.getElementById("resetBtn").style.display = "none";
    }
</script>

</body>
</html>
