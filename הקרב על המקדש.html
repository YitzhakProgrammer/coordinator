<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הקרב על המקדש - מהדורת המיתוס המטורפת</title>
    <!-- חיבור ספרית PeerJS לחיבור רשת ישיר -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- פונט מודרני מבית גוגל -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d131a;
            --bg-panel: rgba(25, 35, 49, 0.85);
            --accent-gold: #ffcc00;
            --accent-neon: #00ffcc;
            --text-light: #f1f2f6;
            --board-gap: #1c2733;
            --cell-light: #2c3e50;
            --cell-dark: #233241;
            --highlight-move: #00ff88;
            --highlight-attack: #ff2a2a;
            --mountain: #3e2723;
            --setup-zone: rgba(0, 255, 136, 0.15);
            --player-blue: linear-gradient(135deg, #00c6ff, #0072ff);
            --opponent-red: linear-gradient(135deg, #f857a6, #ff5858);
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: radial-gradient(circle at center, #1b2838 0%, var(--bg-main) 100%);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            margin-bottom: 5px; 
            color: var(--accent-gold); 
            font-size: 3.5em;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6), 0 4px 10px rgba(0,0,0,0.9);
            letter-spacing: 2px;
            animation: title-glow 3s infinite alternate;
        }

        @keyframes title-glow {
            0% { text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
            100% { text-shadow: 0 0 30px rgba(255, 204, 0, 0.9), 0 0 40px rgba(0, 255, 204, 0.4); }
        }

        #status-msg { 
            margin-bottom: 30px; 
            font-weight: 600; 
            color: #fff; 
            font-size: 1.4em; 
            min-height: 35px; 
            text-align: center; 
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        #lobby {
            background: var(--bg-panel);
            padding: 45px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(255,255,255,0.08);
            margin-top: 20px;
            width: 380px;
            backdrop-filter: blur(20px);
        }

        #lobby h2 {
            margin-top: 0;
            font-weight: 800;
            color: var(--accent-neon);
            font-size: 1.6em;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        
        #game-area {
            display: none;
            flex-direction: row;
            gap: 40px;
            align-items: flex-start;
            max-width: 1300px;
            width: 100%;
            justify-content: center;
        }
        
        #game-board {
            display: grid;
            grid-template-columns: repeat(15, 48px);
            grid-template-rows: repeat(15, 48px);
            gap: 3px;
            background-color: var(--board-gap);
            border: 10px solid #0b0f14;
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9), 0 0 40px rgba(255,204,0,0.15);
        }

        .cell {
            width: 48px;
            height: 48px;
            background-color: var(--cell-light);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 6px;
            transition: all 0.25s ease;
        }
        .cell:nth-child(even) { background-color: var(--cell-dark); }
        
        .cell.highlight { 
            background-color: rgba(0, 255, 136, 0.3) !important; 
            cursor: pointer; 
            box-shadow: inset 0 0 15px var(--highlight-move), 0 0 15px rgba(0,255,136,0.4) !important;
            transform: scale(0.96);
            z-index: 1;
        }
        .cell.attack-highlight { 
            background-color: rgba(255, 42, 42, 0.3) !important; 
            cursor: pointer; 
            animation: pulse-red-cell 1.5s infinite;
            z-index: 1;
        }
        
        .mountain { 
            background: linear-gradient(135deg, #5d4037, #3e2723) !important; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9) !important;
            border-radius: 8px;
            border: 1px solid #2d1c18;
        }
        
        .setup-zone { 
            border: 1px dashed var(--highlight-move);
            background-color: var(--setup-zone) !important;
        }
        
        .piece {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.7);
            font-weight: 800;
            font-size: 10px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.4);
            color: white;
            box-sizing: border-box;
            padding: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            position: relative;
        }
        
        .piece.player { 
            background: var(--player-blue); 
            cursor: pointer; 
        }
        .piece.player:hover { 
            transform: scale(1.2) translateY(-4px); 
            box-shadow: 0 12px 20px rgba(0,0,0,0.7), 0 0 15px #00c6ff;
            z-index: 5;
        }
        
        .piece.opponent { 
            background: var(--opponent-red); 
        }
        .piece.opponent .text-content { display: none; }
        
        .piece.opponent::before {
            content: "אויב";
            font-size: 11px;
            font-weight: 800;
            color: rgba(255,255,255,0.9);
        }

        .rank-badge {
            position: absolute;
            bottom: -5px;
            left: -5px;
            background: #11161b;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            z-index: 2;
        }

        .piece.opponent .rank-badge { display: none; }

        .piece.revealed { 
            border-color: var(--accent-neon) !important; 
            box-shadow: 0 0 25px var(--accent-neon), inset 0 0 10px rgba(255,255,255,0.6) !important; 
            transform: scale(1.25);
            z-index: 10;
        }
        .piece.revealed::before { display: none; }
        .piece.revealed .text-content { display: block !important; }
        .piece.revealed .rank-badge { display: flex !important; }

        #inventory {
            width: 460px;
            background: var(--bg-panel);
            padding: 30px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 680px;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
        }
        #inventory::-webkit-scrollbar { width: 8px; }
        #inventory::-webkit-scrollbar-thumb { background-color: #1c2733; border-radius: 10px; }

        .inventory-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 16px;
            gap: 15px;
            border-right: 4px solid var(--accent-neon);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .row-label {
            font-size: 12px;
            font-weight: bold;
            width: 120px;
            color: #a4b0be;
            line-height: 1.4;
        }
        .row-pieces {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-lobby {
            padding: 18px 36px;
            color: white;
            border: none;
            border-radius: 100px; 
            cursor: pointer;
            width: 100%;
            font-size: 17px;
            margin-bottom: 18px;
            font-weight: 800;
            font-family: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .btn-lobby::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-lobby:hover::before { left: 100%; }

        .btn-easy {
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            color: #0d131a;
            box-shadow: 0 8px 25px rgba(0, 255, 135, 0.35);
        }
        .btn-easy:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 255, 135, 0.5);
        }

        .btn-hard {
            background: linear-gradient(135deg, #ff0076 0%, #ff5b00 100%);
            box-shadow: 0 8px 25px rgba(255, 0, 118, 0.35);
        }
        .btn-hard:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(255, 0, 118, 0.5);
        }

        .btn-network {
            background: linear-gradient(135deg, #9b59b6 0%, #4a00e0 100%);
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.35);
        }
        .btn-network:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(155, 89, 182, 0.5);
        }

        .btn-enter {
            background: transparent;
            border: 2px solid var(--accent-neon);
            color: var(--accent-neon);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.1);
        }
        .btn-enter:hover {
            background: rgba(0, 255, 204, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.3);
        }

        .btn-ready {
            padding: 16px;
            background: linear-gradient(135deg, #ffcc00 0%, #ff6600 100%);
            color: #0d131a;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            font-size: 17px;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.3);
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .btn-ready:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 204, 0, 0.5);
        }

        .input-code { 
            padding: 16px; 
            width: calc(100% - 24px); 
            margin-bottom: 18px; 
            border-radius: 100px; 
            border: 2px solid #233241; 
            text-align: center; 
            font-weight: 600; 
            font-family: inherit;
            font-size: 16px;
            background-color: #1c2733;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .input-code:focus {
            outline: none;
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        hr { 
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            margin: 30px 0; 
            width: 100%;
        }

        @keyframes pulse-red-cell {
            0% { box-shadow: inset 0 0 15px var(--highlight-attack); }
            50% { box-shadow: inset 0 0 25px var(--highlight-attack), 0 0 15px var(--highlight-attack); }
            100% { box-shadow: inset 0 0 15px var(--highlight-attack); }
        }

    </style>
</head>
<body>

    <h1>הקרב על המקדש</h1>
    <div id="status-msg">אנא בחר מצב מערכה במסך הלובי</div>

    <div id="lobby">
        <h2>מערכת יחיד</h2>
        <button class="btn-lobby btn-easy" onclick="startLocalGame('easy')">רמה קלה</button>
        <button class="btn-lobby btn-hard" onclick="startLocalGame('hard')">רמה קשה (התקפית)</button>
        
        <hr>
        
        <h2>מערכת רשת (מול חבר)</h2>
        <button class="btn-lobby btn-network" onclick="initMultiplayer(true)">חולל קוד מערכה</button>
        <input type="text" id="room-code-input" class="input-code" placeholder="הכנס קוד שקיבלת מחבר">
        <button class="btn-lobby btn-enter" onclick="initMultiplayer(false)">היכנס למערכה</button>
    </div>

    <div id="game-area">
        <div id="game-board"></div>
        <div id="inventory">
            <button class="btn-ready" id="ready-btn" onclick="finishSetup()">סיימתי להציב את כל הכוחות</button>
            <div id="pieces-container"></div>
        </div>
    </div>

<script>
    const BOARD_SIZE = 15;
    let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
    let gameState = 'LOBBY'; 
    let aiDifficulty = 'easy';
    let gameMode = 'ai'; 
    let myRole = 'host'; 
    let peer = null;
    let conn = null;
    let draggedPiece = null;
    let selectedPiece = null;
    let opponentReady = false;
    let myReady = false;

    const armyComposition = [
        { name: 'בית המקדש', rank: 100, count: 1 },
        { name: 'חומת ירושלים', rank: 11, count: 5 },
        { name: 'דוד המלך', rank: 10, count: 1 },
        { name: 'נתן הנביא', rank: 9, count: 1 },
        { name: 'יואב שר צבא', rank: 8, count: 4 },
        { name: 'אביתר הכהן', rank: 7, count: 6 },
        { name: 'אסף הלוי', rank: 6, count: 4 },
        { name: 'אבישי הישראלי', rank: 5, count: 4 },
        { name: 'ארוונה היבוסי', rank: 4, count: 5 },
        { name: 'שמשון הגיבור', rank: 3, count: 3 },
        { name: 'אמנון הקטן', rank: 2, count: 9 },
        { name: 'גלית הפלשתי', rank: 1, count: 1 }
    ];

    function startLocalGame(difficulty) {
        gameMode = 'ai';
        myRole = 'host';
        aiDifficulty = difficulty;
        setupGameWindow();
    }

    function initMultiplayer(isHost) {
        gameMode = 'multi';
        document.getElementById('status-msg').textContent = "מתחבר לשרת התיווך...";
        
        if (isHost) {
            myRole = 'host';
            const roomId = "MIGDAS-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(roomId);
            peer.on('open', (id) => {
                alert("קוד המערכה שלך הוא: " + id + "\nשלח אותו לחבר שלך כעת!");
                document.getElementById('status-msg').textContent = "ממתין לחבר (קוד: " + id + ")...";
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupNetworkListeners();
            });
        } else {
            myRole = 'guest';
            const targetId = document.getElementById('room-code-input').value.trim();
            if (!targetId) { alert("אנא הזן קוד מערכה תקין!"); return; }
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(targetId);
                setupNetworkListeners();
            });
        }
    }

    function setupNetworkListeners() {
        conn.on('open', () => {
            document.getElementById('status-msg').textContent = "מחובר לחבר! עובר לשלב ההצבה.";
            setTimeout(setupGameWindow, 1000);
        });
        conn.on('data', (data) => {
            handleIncomingData(data);
        });
    }

    function setupGameWindow() {
        gameState = 'SETUP';
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-area').style.display = 'flex';
        document.getElementById('status-msg').textContent = 'שלב ההצבה: גרור את 44 הכוחות אל אזור ההצבה המסומן בלוח';
        initBoard();
        initPieces();
    }

    function initBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        for (let row = 0; row < BOARD_SIZE; row++) {
            for (let col = 0; col < BOARD_SIZE; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.row = row;
                cell.dataset.col = col;

                if ((row === 6 || row === 7) && ((col >= 3 && col <= 5) || (col >= 9 && col <= 11))) {
                    cell.classList.add('mountain');
                }

                if (row >= 11 && col >= 2 && col <= 12) {
                    cell.classList.add('setup-zone');
                    cell.addEventListener('dragover', e => e.preventDefault());
                    cell.addEventListener('drop', e => handleDrop(e, cell, row, col));
                }

                cell.addEventListener('click', () => handleCellClick(row, col));
                board.appendChild(cell);
            }
        }
    }

    function initPieces() {
        const container = document.getElementById('pieces-container');
        container.innerHTML = '';
        
        armyComposition.forEach(type => {
            const rowDiv = document.createElement('div');
            rowDiv.classList.add('inventory-row');

            const label = document.createElement('div');
            label.classList.add('row-label');
            label.textContent = `${type.name}\n(חוזק ${type.rank === 100 ? 'מטרה' : type.rank})`;
            rowDiv.appendChild(label);

            const piecesDiv = document.createElement('div');
            piecesDiv.classList.add('row-pieces');

            for (let i = 0; i < type.count; i++) {
                const piece = createPieceElement(type.name, type.rank, 'player');
                piece.draggable = true;
                piece.addEventListener('dragstart', () => { if(gameState === 'SETUP') draggedPiece = piece; });
                piece.addEventListener('dragend', () => draggedPiece = null);
                piecesDiv.appendChild(piece);
            }
            rowDiv.appendChild(piecesDiv);
            container.appendChild(rowDiv);
        });
    }

    function createPieceElement(name, rank, owner) {
        const piece = document.createElement('div');
        piece.classList.add('piece', owner);
        piece.dataset.name = name;
        piece.dataset.rank = rank;
        piece.dataset.owner = owner;
        
        const textSpan = document.createElement('span');
        textSpan.classList.add('text-content');
        textSpan.textContent = name;
        piece.appendChild(textSpan);

        const badge = document.createElement('span');
        badge.classList.add('rank-badge');
        badge.textContent = rank === 100 ? '★' : rank;
        piece.appendChild(badge);

        return piece;
    }

    function handleDrop(e, cell, row, col) {
        e.preventDefault();
        if (gameState !== 'SETUP' || !draggedPiece || cell.hasChildNodes()) return;
        cell.appendChild(draggedPiece);
        boardState[row][col] = { name: draggedPiece.dataset.name, rank: parseInt(draggedPiece.dataset.rank), owner: 'player', element: draggedPiece };
    }

    function finishSetup() {
        const totalRemaining = document.querySelectorAll('#pieces-container .piece').length;
        if (totalRemaining > 0) {
            alert('עליך להציב את כל 44 הכלים בשטח שלך!');
            return;
        }
        myReady = true;
        document.getElementById('inventory').style.display = 'none';
        document.querySelectorAll('.setup-zone').forEach(el => el.classList.remove('setup-zone'));
        
        if (gameMode === 'ai') {
            setupAIStrategy();
            gameState = 'PLAYER_TURN';
            document.getElementById('status-msg').textContent = 'המערכה החלה! הגן על המקדש ותקוף בתבונה.';
        } else {
            let serializedPositions = [];
            for(let r=11; r<=14; r++) {
                for(let c=2; c<=12; c++) {
                    if(boardState[r][c]) {
                        serializedPositions.push({ name: boardState[r][c].name, rank: boardState[r][c].rank, r: r, c: c });
                    }
                }
            }
            conn.send({ type: 'READY', positions: serializedPositions });
            checkMultiplayerStart();
        }
    }

    function checkMultiplayerStart() {
        if (myReady && opponentReady) {
            if (myRole === 'host') {
                gameState = 'PLAYER_TURN';
                document.getElementById('status-msg').textContent = "המערכה פעילה! התור שלך לפקד.";
            } else {
                gameState = 'OPPONENT_TURN';
                document.getElementById('status-msg').textContent = "המערכה פעילה! ממתין למהלך של המארח...";
            }
        } else {
            document.getElementById('status-msg').textContent = "הכוחות ערוכים בחזית. ממתין לחבר...";
        }
    }

    function setupAIStrategy() {
        let aiCells = [];
        for (let row = 0; row <= 3; row++) {
            for (let col = 2; col <= 12; col++) aiCells.push({ row, col });
        }

        let piecesToPlace = [];
        armyComposition.forEach(type => {
            for (let i = 0; i < type.count; i++) piecesToPlace.push({ name: type.name, rank: type.rank });
        });

        const placePiece = (name, row, col) => {
            const idx = piecesToPlace.findIndex(p => p.name === name);
            if (idx > -1) {
                const pData = piecesToPlace.splice(idx, 1)[0];
                const pieceEl = createPieceElement(pData.name, pData.rank, 'opponent');
                getCellElement(row, col).appendChild(pieceEl);
                boardState[row][col] = { name: pData.name, rank: pData.rank, owner: 'opponent', element: pieceEl };
                aiCells = aiCells.filter(c => !(c.row === row && c.col === col));
            }
        };

        placePiece('בית המקדש', 0, 7);
        placePiece('חומת ירושלים', 0, 6);
        placePiece('חומת ירושלים', 0, 8);
        placePiece('חומת ירושלים', 1, 6);
        placePiece('חומת ירושלים', 1, 7);
        placePiece('חומת ירושלים', 1, 8);

        piecesToPlace.sort(() => Math.random() - 0.5);
        piecesToPlace.forEach((pData) => {
            const cellPos = aiCells.pop();
            const pieceEl = createPieceElement(pData.name, pData.rank, 'opponent');
            getCellElement(cellPos.row, cellPos.col).appendChild(pieceEl);
            boardState[cellPos.row][cellPos.col] = { name: pData.name, rank: pData.rank, owner: 'opponent', element: pieceEl };
        });
    }

    function handleCellClick(row, col) {
        if (gameState !== 'PLAYER_TURN') return;
        const clickedData = boardState[row][col];
        const cellEl = getCellElement(row, col);

        if (cellEl.classList.contains('highlight') || cellEl.classList.contains('attack-highlight')) {
            executeMove(selectedPiece.row, selectedPiece.col, row, col);
            return;
        }
        clearHighlights();

        if (clickedData && clickedData.owner === 'player') {
            if (clickedData.rank === 11 || clickedData.rank === 100) return; 
            selectedPiece = { row, col, data: clickedData };
            showValidMoves(row, col, clickedData);
        }
    }

    function showValidMoves(startRow, startCol, pieceData) {
        const moves = calculateValidMoves(startRow, startCol, pieceData);
        moves.forEach(move => {
            const cellEl = getCellElement(move.row, move.col);
            if (move.type === 'move') cellEl.classList.add('highlight');
            if (move.type === 'attack') cellEl.classList.add('attack-highlight');
        });
    }

    function calculateValidMoves(r, c, pieceData) {
        const moves = [];
        const isAmnon = pieceData.name === 'אמנון הקטן';
        const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

        dirs.forEach(dir => {
            let step = 1;
            while (true) {
                let nr = r + (dir[0] * step);
                let nc = c + (dir[1] * step);
                
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                if ((nr === 6 || nr === 7) && ((nc >= 3 && nc <= 5) || (nc >= 9 && nc <= 11))) break;

                const target = boardState[nr][nc];
                if (!target) {
                    moves.push({ row: nr, col: nc, type: 'move' });
                } else {
                    if (target.owner !== pieceData.owner) moves.push({ row: nr, col: nc, type: 'attack' });
                    break;
                }
                if (!isAmnon) break; 
                step++;
            }
        });
        return moves;
    }

    function executeMove(fromR, fromC, toR, toC) {
        clearHighlights();
        if (gameMode === 'multi') {
            conn.send({ type: 'MOVE', fromR: 14 - fromR, fromC: 14 - fromC, toR: 14 - toR, toC: 14 - toC });
        }
        localMoveExecution(fromR, fromC, toR, toC);
    }

    function localMoveExecution(fromR, fromC, toR, toC) {
        const attacker = boardState[fromR][fromC];
        const defender = boardState[toR][toC];
        const toCell = getCellElement(toR, toC);
        const fromCell = getCellElement(fromR, fromC);

        if (!defender) {
            toCell.appendChild(attacker.element);
            boardState[toR][toC] = attacker;
            boardState[fromR][fromC] = null;
            endTurn(attacker.owner);
        } else {
            defender.element.classList.add('revealed');
            attacker.element.classList.add('revealed');
            defender.element.dataset.combatLock = "true";
            attacker.element.dataset.combatLock = "true";
            
            setTimeout(() => {
                delete defender.element.dataset.combatLock;
                delete attacker.element.dataset.combatLock;
                if(defender.element) defender.element.classList.remove('revealed');
                if(attacker.element) attacker.element.classList.remove('revealed');
                
                let result = '';
                if (defender.name === 'בית המקדש') result = 'game_over';
                else if (attacker.name === 'שמשון הגיבור' && defender.name === 'חומת ירושלים') result = 'win';
                else if (defender.name === 'חומת ירושלים') result = 'lose'; 
                // חוק מיוחד: אם גלית הפלשתי (מספר 1) תוקף ראשון את דוד המלך - הוא מנצח
                else if (attacker.name === 'גלית הפלשתי' && defender.name === 'דוד המלך') result = 'win';
                else {
                    if (attacker.rank > defender.rank) result = 'win';
                    else if (attacker.rank < defender.rank) result = 'lose';
                    else result = 'draw';
                }

                if (result === 'game_over') {
                    document.getElementById('status-msg').textContent = (attacker.owner === 'player' ? 'ניצחת שחוקות!' : 'הפסדת!') + ' בית המקדש נכבש!';
                    gameState = 'GAME_OVER';
                    return;
                } else if (result === 'win') {
                    toCell.removeChild(defender.element);
                    toCell.appendChild(attacker.element);
                    boardState[toR][toC] = attacker;
                    boardState[fromR][fromC] = null;
                } else if (result === 'lose') {
                    fromCell.removeChild(attacker.element);
                    boardState[fromR][fromC] = null;
                } else if (result === 'draw') {
                    fromCell.removeChild(attacker.element);
                    toCell.removeChild(defender.element);
                    boardState[fromR][fromC] = null;
                    boardState[toR][toC] = null;
                }
                endTurn(attacker.owner);
            }, 1200);
        }
    }

    function endTurn(currentTurnOwner) {
        if (gameState === 'GAME_OVER') return;
        
        if (gameMode === 'ai') {
            if (currentTurnOwner === 'player') {
                gameState = 'AI_TURN';
                document.getElementById('status-msg').textContent = 'תור המחשב חושב חסוי...';
                setTimeout(playAIStrategy, 600);
            } else {
                gameState = 'PLAYER_TURN';
                document.getElementById('status-msg').textContent = 'התור שלך! קדם את כוחותיך.';
            }
        } else {
            if (currentTurnOwner === 'player') {
                gameState = 'OPPONENT_TURN';
                document.getElementById('status-msg').textContent = 'תור היריב בפעולה...';
            } else {
                gameState = 'PLAYER_TURN';
                document.getElementById('status-msg').textContent = 'תורך לפעול!';
            }
        }
    }

    function handleIncomingData(data) {
        if (data.type === 'READY') {
            opponentReady = true;
            data.positions.forEach(pos => {
                const targetR = 14 - pos.r;
                const targetC = 14 - pos.c;
                const pieceEl = createPieceElement(pos.name, pos.rank, 'opponent');
                getCellElement(targetR, targetC).appendChild(pieceEl);
                boardState[targetR][targetC] = { name: pos.name, rank: pos.rank, owner: 'opponent', element: pieceEl };
            });
            checkMultiplayerStart();
        } else if (data.type === 'MOVE') {
            localMoveExecution(data.fromR, data.fromC, data.toR, data.toC);
        }
    }

    function playAIStrategy() {
        let allMoves = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const p = boardState[r][c];
                if (p && p.owner === 'opponent' && p.rank !== 11 && p.rank !== 100) {
                    const moves = calculateValidMoves(r, c, p);
                    moves.forEach(m => {
                        let score = 0;
                        if (aiDifficulty === 'hard') {
                            if (m.type === 'move') {
                                score += (m.row > r) ? 15 : 0; 
                                if (m.col >= 4 && m.col <= 10) score += 5; 
                            } else if (m.type === 'attack') {
                                const target = boardState[m.row][m.col];
                                if (p.name === 'גלית הפלשתי' && target.name === 'דוד המלך') score += 1000;
                                else if (p.name === 'שמשון הגיבור' && target.name === 'חומת ירושלים') score += 1000;
                                else if (target.name === 'חומת ירושלים') score -= 800; 
                                else if (p.rank > target.rank) score += 150; 
                                else score -= 150;
                            }
                        } else {
                            score += (m.type === 'attack') ? 10 : 0;
                        }
                        allMoves.push({ pieceR: r, pieceC: c, move: m, score: score });
                    });
                }
            }
        }

        if (allMoves.length > 0) {
            allMoves.sort((a, b) => b.score - a.score);
            const topMoves = allMoves.filter(m => m.score >= allMoves[0].score - 2);
            const chosen = topMoves[Math.floor(Math.random() * topMoves.length)];
            executeMove(chosen.pieceR, chosen.pieceC, chosen.move.row, chosen.move.col);
        } else {
            document.getElementById('status-msg').textContent = 'למחשב אין מהלכים נותרים. ניצחת!';
            gameState = 'GAME_OVER';
        }
    }

    function clearHighlights() {
        document.querySelectorAll('.highlight, .attack-highlight').forEach(el => {
            el.classList.remove('highlight');
            el.classList.remove('attack-highlight');
        });
    }

    function getCellElement(row, col) {
        return document.querySelector(`.cell[data-row='${row}'][data-col='${col}']`);
    }
</script>
