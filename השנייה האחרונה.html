<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>שנייה אחת לחיות - מתח שיא</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; cursor: crosshair; }
        #ui { position: absolute; top: 20; width: 100%; text-align: center; color: #ff0044; pointer-events: none; }
        #timer { font-size: 60px; font-weight: bold; }
        canvas { display: block; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
    </style>
</head>
<body>

    <div id="ui">
        <div id="timer">01:00</div>
        <div style="font-size: 18px; color: #fff;">הזמן זז רק כשאתה זז!</div>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let lastMousePos = { x: 0, y: 0 };
        let isMoving = false;
        let timeLeft = 60;
        let score = 0;
        let gameActive = true;

        const player = { x: canvas.width / 2, y: canvas.height / 2, r: 15 };
        const bullets = [];
        const enemies = [];

        // יצירת אויבים (רובוטים אדומים)
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if(side === 0) { x = Math.random() * canvas.width; y = -50; }
            else if(side === 1) { x = Math.random() * canvas.width; y = canvas.height + 50; }
            else if(side === 2) { x = -50; y = Math.random() * canvas.height; }
            else { x = canvas.width + 50; y = Math.random() * canvas.height; }
            enemies.push({ x, y, r: 20, lastShot: 0 });
        }

        window.addEventListener("mousemove", (e) => {
            const dist = Math.hypot(e.clientX - lastMousePos.x, e.clientY - lastMousePos.y);
            isMoving = dist > 2; // אם העכבר זז יותר מ-2 פיקסלים
            lastMousePos = { x: e.clientX, y: e.clientY };
            player.x = e.clientX;
            player.y = e.clientY;
        });

        function update() {
            if (!gameActive) return;

            // אם זזים - הזמן רץ
            if (isMoving) {
                timeLeft -= 0.016;
                document.getElementById("timer").innerText = timeLeft.toFixed(2);
                
                // עדכון קליעים
                bullets.forEach((b, i) => {
                    b.x += b.vx;
                    b.y += b.vy;
                    if(Math.hypot(b.x - player.x, b.y - player.y) < player.r) {
                        gameActive = false;
                        alert("חטפת כדור! המשחק נגמר.");
                        location.reload();
                    }
                });

                // עדכון אויבים
                enemies.forEach((en, i) => {
                    const dx = player.x - en.x;
                    const dy = player.y - en.y;
                    const dist = Math.hypot(dx, dy);
                    en.x += (dx / dist) * 2;
                    en.y += (dy / dist) * 2;

                    // אויבים יורים
                    if (Date.now() - en.lastShot > 2000) {
                        bullets.push({
                            x: en.x, y: en.y,
                            vx: (dx / dist) * 5,
                            vy: (dy / dist) * 5
                        });
                        en.lastShot = Date.now();
                    }
                });

                if (Math.random() < 0.02) spawnEnemy();
            }

            if (timeLeft <= 0) {
                gameActive = false;
                alert("הזמן נגמר! הניקוד שלך: " + score);
                location.reload();
            }

            isMoving = false; // איפוס תנועה לפריימים הבאים
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // שחקן (העכבר שלך)
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#00ffcc";
            ctx.fillStyle = "#00ffcc";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fill();

            // אויבים
            ctx.shadowColor = "#ff0044";
            enemies.forEach(en => {
                ctx.fillStyle = "#ff0044";
                ctx.fillRect(en.x - 20, en.y - 20, 40, 40);
            });

            // קליעים
            ctx.shadowColor = "#fff";
            ctx.fillStyle = "#fff";
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        spawnEnemy();
        update();
    </script>
</body>
</html>
