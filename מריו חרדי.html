<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בחור הישיבה - בריחה מהמשגיח</title>
    <style>
        body {
            margin: 0;
            background-color: #eef2f3;
            color: #333;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #2c3e50;
            background-color: #87CEEB;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .instructions {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>המסע אל הסטנדר - בריחה מהמשגיח!</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="instructions">
        <b>חצים ימינה/שמאלה</b> לתנועה | <b>חץ למעלה או רווח</b> לקפיצה <br>
        המשגיח מאחוריכם! רוצו קדימה אל הסטנדר ואל תתנו לו לתפוס אתכם! (לחצו <b>R</b> לאיפוס)
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gravity = 0.5;
        const keys = {};
        
        let player, mashgiach, cameraX, score, gameState, platforms, books, hazards, enemies, stativ, animFrame;
        const levelWidth = 3200; 

        function initGame() {
            player = {
                x: 300, // השחקן מתחיל מעט קדימה כדי שיהיה לו מרווח ביטחון מהמשגיח
                y: 200,
                width: 24,
                height: 50, 
                velX: 0,
                velY: 0,
                speed: 4.5,
                jumpForce: 11.5,
                grounded: false,
                walkCycle: 0,
                facing: "RIGHT"
            };

            // הגדרות המשגיח הרודף
            mashgiach = {
                x: 0, // מתחיל מתחילת השלב (משמאל) ורודף ימינה
                y: 310,
                width: 26,
                height: 52,
                speed: 1.8, // מהירות קבועה שמאלצת את השחקן להתקדם
                walkCycle: 0
            };

            cameraX = 0;
            score = 0;
            animFrame = 0;
            gameState = "PLAYING"; 

            platforms = [
                { x: 0, y: 360, width: 600, height: 40 },
                { x: 750, y: 360, width: 600, height: 40 },
                { x: 1450, y: 360, width: 600, height: 40 },
                { x: 2150, y: 360, width: 450, height: 40 },
                { x: 2750, y: 360, width: 500, height: 40 },

                { x: 350, y: 270, width: 150, height: 15 },
                { x: 530, y: 190, width: 100, height: 15 },
                
                { x: 780, y: 260, width: 150, height: 15 },
                { x: 980, y: 180, width: 150, height: 15 },

                { x: 1500, y: 270, width: 120, height: 15 },
                { x: 1700, y: 200, width: 120, height: 15 },

                { x: 2300, y: 260, width: 150, height: 15 },
                { x: 2550, y: 190, width: 120, height: 15 }
            ];

            books = [
                { x: 390, y: 220, width: 22, height: 30, collected: false },
                { x: 540, y: 140, width: 22, height: 30, collected: false },
                { x: 830, y: 210, width: 22, height: 30, collected: false },
                { x: 1020, y: 130, width: 22, height: 30, collected: false },
                { x: 1530, y: 220, width: 22, height: 30, collected: false },
                { x: 1730, y: 150, width: 22, height: 30, collected: false },
                { x: 2330, y: 210, width: 22, height: 30, collected: false },
                { x: 2600, y: 140, width: 22, height: 30, collected: false }
            ];

            hazards = [
                { x: 1150, y: 340, width: 40, height: 20 },
                { x: 2100, y: 340, width: 40, height: 20 }
            ];

            enemies = [
                { x: 600, y: 315, width: 24, height: 45, startX: 450, endX: 580, speed: 1.3, direction: 1, alive: true, walkCycle: 0 },
                { x: 900, y: 315, width: 24, height: 45, startX: 780, endX: 1100, speed: 1.6, direction: 1, alive: true, walkCycle: 0 },
                { x: 1650, y: 315, width: 24, height: 45, startX: 1480, endX: 1850, speed: 1.4, direction: 1, alive: true, walkCycle: 0 },
                { x: 830, y: 215, width: 24, height: 45, startX: 780, endX: 910, speed: 1.1, direction: 1, alive: true, walkCycle: 0 },
                { x: 2320, y: 215, width: 24, height: 45, startX: 2300, endX: 2430, speed: 1.8, direction: 1, alive: true, walkCycle: 0 }
            ];

            stativ = { x: 3050, y: 290, width: 25, height: 70 };
        }

        window.addEventListener("keydown", (e) => { 
            keys[e.key] = true; 
            if (e.key === "r" || e.key === "R") initGame();
        });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        function update() {
            if (gameState !== "PLAYING") return;
            animFrame++;

            // --- עדכון תנועת שחקן ---
            if (keys["ArrowRight"]) { 
                player.velX = player.speed; 
                player.facing = "RIGHT";
                player.walkCycle += 0.2;
            } 
            else if (keys["ArrowLeft"]) { 
                player.velX = -player.speed; 
                player.facing = "LEFT";
                player.walkCycle += 0.2;
            } 
            else { 
                player.velX = 0; 
                player.walkCycle = 0;
            }

            if ((keys["ArrowUp"] || keys[" "]) && player.grounded) {
                player.velY = -player.jumpForce;
                player.grounded = false;
            }

            player.velY += gravity;
            player.x += player.velX;
            player.y += player.velY;

            if (player.x < 0) player.x = 0;
            if (player.y > canvas.height) { gameState = "GAMEOVER"; }

            player.grounded = false;

            // התנגשות שחקן עם פלטפורמות
            platforms.forEach(plat => {
                if (player.x + player.width > plat.x &&
                    player.x < plat.x + plat.width &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height - player.velY <= plat.y + 12 &&
                    player.velY >= 0) {
                    
                    player.y = plat.y - player.height;
                    player.velY = 0;
                    player.grounded = true;
                }
            });

            // --- עדכון המשגיח ---
            mashgiach.x += mashgiach.speed;
            mashgiach.walkCycle += 0.1;
            
            // התאמת גובה המשגיח לפי הקרקע כדי שלא ירחף (הוא רץ על קו רצפת הבסיס)
            mashgiach.y = 360 - mashgiach.height;

            // אם המשגיח תופס את השחקן - המשחק נגמר
            if (checkCollision(player, mashgiach)) {
                gameState = "GAMEOVER";
            }

            // --- עדכון אנשים זזים ---
            enemies.forEach(enemy => {
                if (!enemy.alive) return;

                enemy.x += enemy.speed * enemy.direction;
                enemy.walkCycle += 0.15;
                if (enemy.x > enemy.endX || enemy.x < enemy.startX) {
                    enemy.direction *= -1; 
                }

                if (checkCollision(player, enemy)) {
                    if (player.velY > 0 && player.y + player.height - player.velY <= enemy.y + 15) {
                        enemy.alive = false;
                        player.velY = -player.jumpForce * 0.6; 
                        score += 20; 
                    } else {
                        gameState = "GAMEOVER";
                    }
                }
            });

            // התנגשות קוצים
            hazards.forEach(hazard => {
                if (checkCollision(player, hazard)) { gameState = "GAMEOVER"; }
            });

            // איסוף ספרים
            books.forEach(book => {
                if (!book.collected && checkCollision(player, book)) {
                    book.collected = true;
                    score += 10;
                }
            });

            if (checkCollision(player, stativ)) { gameState = "WON"; }

            // מצלמה עוקבת (ממוקדת בשחקן אך לא חוזרת שמאלה מדי)
            cameraX = player.x - canvas.width / 3;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;
        }

        function drawHolyBook(x, y, w, h) {
            ctx.fillStyle = "#4a2c11"; 
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
            ctx.fillStyle = "#d4af37";
            ctx.fillRect(x + 6, y + 8, w - 12, h - 16);
            ctx.fillStyle = "#4a2c11";
            ctx.fillRect(x + 8, y + 11, w - 16, 2);
            ctx.fillStyle = "#fcf3cf";
            ctx.fillRect(x + w - 2, y + 2, 2, h - 4);
        }

        // פונקציית ציור דמויות אנושיות
        function drawHuman(x, y, type, walkCycle, facing, isAlive) {
            if (!isAlive) return;

            let legSwing = Math.sin(walkCycle) * 7;
            let armSwing = Math.sin(walkCycle) * 5;

            if (type === "PLAYER") {
                // --- בחור הישיבה ---
                ctx.fillStyle = "#111111";
                ctx.fillRect(x + 4 + legSwing/2, y + 34, 6, 13);
                ctx.fillRect(x + 14 - legSwing/2, y + 34, 6, 13);
                ctx.fillStyle = "#000"; 
                ctx.fillRect(x + (facing === "RIGHT" ? 4 : 2) + legSwing/2, y + 47, 8, 3);
                ctx.fillRect(x + (facing === "RIGHT" ? 14 : 12) - legSwing/2, y + 47, 8, 3);

                ctx.fillStyle = "#ffffff"; 
                ctx.fillRect(x + 5, y + 12, 14, 22);
                ctx.fillStyle = "#111111"; 
                ctx.fillRect(x + 2, y + 12, 4, 22); 
                ctx.fillRect(x + 18, y + 12, 4, 22); 

                ctx.fillStyle = "#111111"; 
                ctx.fillRect(x - 1 + armSwing/2, y + 14, 4, 14);
                ctx.fillStyle = "#ffdbac"; 
                ctx.fillRect(x - 1 + armSwing/2, y + 28, 4, 4);

                ctx.fillStyle = "#ffdbac"; 
                ctx.fillRect(x + 6, y + 3, 12, 10);
                
                ctx.fillStyle = "#000";
                if (facing === "RIGHT") { ctx.fillRect(x + 14, y + 6, 3, 7); } 
                else { ctx.fillRect(x + 7, y + 6, 3, 7); }

                ctx.fillStyle = "#000000";
                ctx.fillRect(x - 2, y, 28, 3); 
                ctx.fillRect(x + 4, y - 9, 16, 9); 

            } else if (type === "MASHGIACH") {
                // --- המשגיח הרודף (חליפה ארוכה/פראק מכובד וזקן לבן/אפור) ---
                ctx.fillStyle = "#0a0a0a";
                // רגליים מבצבצות מתחת למעיל
                ctx.fillRect(x + 5 + legSwing/2, y + 38, 6, 11);
                ctx.fillRect(x + 15 - legSwing/2, y + 38, 6, 11);
                
                // מעיל ארוך (סירטוק/פראק) שמכסה את רוב הגוף
                ctx.fillRect(x + 2, y + 12, 22, 28);
                
                // צווארון לבן קטן
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x + 10, y + 12, 6, 3);

                // ידיים מאחורי הגב (תנוחה קלאסית של משגיח)
                ctx.fillStyle = "#0a0a0a";
                ctx.fillRect(x - 1, y + 14, 4, 15);

                // פנים
                ctx.fillStyle = "#fddcb5";
                ctx.fillRect(x + 7, y + 3, 12, 10);

                // זקן אפור מכובד ומנהיגותי
                ctx.fillStyle = "#bdc3c7";
                ctx.fillRect(x + 11, y + 11, 7, 8); // זקן יורד מטה

                // מגבעת רחבה
                ctx.fillStyle = "#000000";
                ctx.fillRect(x - 3, y, 32, 3); 
                ctx.fillRect(x + 4, y - 10, 18, 10);

            } else {
                // --- דמויות אנשי הרחוב ---
                ctx.fillStyle = "#2980b9";
                ctx.fillRect(x + 4 + legSwing/2, y + 30, 6, 12);
                ctx.fillRect(x + 14 - legSwing/2, y + 30, 6, 12);
                ctx.fillStyle = "#7f8c8d"; 
                ctx.fillRect(x + 3 + legSwing/2, y + 42, 8, 3);
                ctx.fillRect(x + 13 - legSwing/2, y + 42, 8, 3);

                ctx.fillStyle = "#c0392b";
                ctx.fillRect(x + 3, y + 12, 18, 18);

                ctx.fillStyle = "#edbb99";
                ctx.fillRect(x - 1 - armSwing/2, y + 14, 4, 12);
                ctx.fillRect(x + 21 + armSwing/2, y + 14, 4, 12);

                ctx.fillStyle = "#edbb99";
                ctx.fillRect(x + 6, y + 2, 12, 10);
                ctx.fillStyle = "#111111"; 
                ctx.fillRect(x + 7, y + 4, 10, 3);
                ctx.fillStyle = "#d35400"; 
                ctx.fillRect(x + 6, y, 12, 3);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // פלטפורמות
            platforms.forEach((plat, index) => {
                ctx.fillStyle = "#8B4513"; 
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.fillStyle = "#27ae60"; 
                ctx.fillRect(plat.x, plat.y, plat.width, 6);
            });

            // קוצים
            hazards.forEach(hazard => {
                ctx.fillStyle = "#e74c3c"; 
                ctx.fillRect(hazard.x, hazard.y, hazard.width, hazard.height);
                ctx.fillStyle = "#c0392b";
                for(let i = 0; i < hazard.width; i += 10) {
                    ctx.beginPath();
                    ctx.moveTo(hazard.x + i, hazard.y + hazard.height);
                    ctx.lineTo(hazard.x + i + 5, hazard.y);
                    ctx.lineTo(hazard.x + i + 10, hazard.y + hazard.height);
                    ctx.fill();
                }
            });

            // ציור אנשי הרחוב
            enemies.forEach(enemy => {
                drawHuman(enemy.x, enemy.y, "ENEMY", enemy.walkCycle, enemy.direction > 0 ? "RIGHT" : "LEFT", enemy.alive);
            });

            // ספרים
            books.forEach(book => {
                if (!book.collected) {
                    drawHolyBook(book.x, book.y, book.width, book.height);
                }
            });

            // הסטנדר
            ctx.fillStyle = "#d4af37";
            ctx.fillRect(stativ.x + 10, stativ.y + 20, 5, 50); 
            ctx.fillRect(stativ.x, stativ.y + 10, stativ.width, 10); 
            ctx.fillRect(stativ.x + 2, stativ.y + 65, 21, 5); 

            // ציור המשגיח הרודף מאחור
            drawHuman(mashgiach.x, mashgiach.y, "MASHGIACH", mashgiach.walkCycle, "RIGHT", true);

            // ציור בחור הישיבה (השחקן)
            drawHuman(player.x, player.y, "PLAYER", player.walkCycle, player.facing, true);

            ctx.restore(); 

            // מדדים קבועים
            ctx.fillStyle = "#333";
            ctx.font = "bold 18px Arial";
            ctx.fillText("נקודות: " + score, 20, 35);

            // אזהרת מרחק מהמשגיח (אם הוא מתקרב מדי והוא מחוץ למסך)
            let distance = player.x - mashgiach.x;
            if (distance < 350 && gameState === "PLAYING") {
                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 16px Arial";
                ctx.fillText("⚠️ המשגיח מתקרב!!", 20, 65);
            }

            // מסכי סיום
            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 36px Arial";
                ctx.textAlign = "center";
                // בדיקה אם הסיבה להפסד היא תפיסה של המשגיח או נפילה/קוצים
                if (player.x <= mashgiach.x + mashgiach.width) {
                    ctx.fillText("המשגיח תפס אותך!", canvas.width / 2, canvas.height / 2 - 20);
                } else {
                    ctx.fillText("נפסלת!", canvas.width / 2, canvas.height / 2 - 20);
                }
                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("לחץ על R כדי להתחיל מחדש", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "start";
            }

            if (gameState === "WON") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#2ecc71";
                ctx.font = "bold 36px Arial";
                ctx.textAlign = "center";
                ctx.fillText("כל הכבוד! הגעת אל הסטנדר בזמן!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("התמדת בלימוד והגעת ליעד לפני המשגיח.", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "start";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();
    </script>
</body>
</html>
