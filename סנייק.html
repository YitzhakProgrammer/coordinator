<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neon Snake PRO</title>
    <style>
        :root { --bg: #020617; --snake: #22d3ee; --food: #f43f5e; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        canvas { background: #000; border: 5px solid #1e293b; border-radius: 10px; box-shadow: 0 0 50px rgba(34, 211, 238, 0.15); }
        
        .stats { width: 400px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        #score-val { color: var(--snake); }
        #best-val { color: #fbbf24; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        h1 { font-size: 50px; margin-bottom: 20px; text-shadow: 0 0 20px var(--snake); }
        button { padding: 15px 40px; font-size: 20px; background: var(--snake); border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--snake); }
    </style>
</head>
<body>

    <div class="stats">
        <div>SCORE: <span id="score-val">0</span></div>
        <div>BEST: <span id="best-val">0</span></div>
    </div>

    <canvas id="snakeGame" width="400" height="400"></canvas>

    <div id="menu" class="overlay">
        <h1>NEON SNAKE</h1>
        <button onclick="initGame()">התחל משחק</button>
        <p style="margin-top: 20px; color: #64748b;">השתמש בחצים במקלדת כדי לזוז</p>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score-val");
        const bestEl = document.getElementById("best-val");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let bestScore = localStorage.getItem("snakeBest") || 0;
        bestEl.innerText = bestScore;

        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let gameSpeed = 100;
        let gameLoop;

        function initGame() {
            document.getElementById("menu").style.display = "none";
            snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
            nextDx = 0; nextDy = -1;
            dx = 0; dy = -1;
            score = 0;
            scoreEl.innerText = score;
            gameSpeed = 100;
            spawnFood();
            
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, gameSpeed);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // וודא שהאוכל לא על הסנייק
            if (snake.some(part => part.x === food.x && part.y === food.y)) spawnFood();
        }

        window.addEventListener("keydown", e => {
            switch(e.key) {
                case "ArrowUp": if(dy !== 1) { nextDx = 0; nextDy = -1; } break;
                case "ArrowDown": if(dy !== -1) { nextDx = 0; nextDy = 1; } break;
                case "ArrowLeft": if(dx !== 1) { nextDx = -1; nextDy = 0; } break;
                case "ArrowRight": if(dx !== -1) { nextDx = 1; nextDy = 0; } break;
            }
        });

        function draw() {
            dx = nextDx; dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // מנהרות - מעבר דרך קירות
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // בדיקת התנגשות בעצמו
            if (snake.some(part => part.x === head.x && part.y === head.y)) {
                return gameOver();
            }

            snake.unshift(head);

            // בדיקה אם אכל
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                spawnFood();
                // הגברת מהירות
                if (gameSpeed > 50) {
                    clearInterval(gameLoop);
                    gameSpeed -= 2;
                    gameLoop = setInterval(draw, gameSpeed);
                }
            } else {
                snake.pop();
            }

            // ציור
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ציור אוכל (ניאון אדום)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#f43f5e";
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

            // ציור סנייק
            snake.forEach((part, index) => {
                const alpha = 1 - (index / snake.length); // אפקט דהייה לזנב
                ctx.shadowBlur = index === 0 ? 20 : 0;
                ctx.shadowColor = "#22d3ee";
                ctx.fillStyle = `rgba(34, 211, 238, ${alpha})`;
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            clearInterval(gameLoop);
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("snakeBest", bestScore);
                bestEl.innerText = bestScore;
            }
            document.getElementById("menu").style.display = "flex";
            document.querySelector("h1").innerText = "GAME OVER";
            document.querySelector("button").innerText = "נסה שוב";
        }
    </script>
</body>
</html>
