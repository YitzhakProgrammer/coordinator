<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איקס עיגול - מהדורת לוח משופרת</title>
    <style>
        :root {
            --board-border: #3e2712;
            --cell-light: #f0d9b5;
            --cell-dark: #b58863;
            --btn-blue: #34495e;
            --btn-green: #27ae60;
            --btn-red: #c0392b;
            --btn-orange: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .menu-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
        }

        .btn-size {
            background-color: var(--btn-blue);
            color: white;
            font-size: 1.1rem;
            min-width: 100px;
        }

        .btn-size.active {
            outline: 3px solid #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-reset { background-color: var(--btn-red); color: white; }
        .btn-undo { background-color: var(--btn-orange); color: white; }
        .btn-end { background-color: var(--btn-green); color: white; }

        .game-container {
            background: #5d3a1a;
            padding: 12px;
            border-radius: 5px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 8px solid var(--board-border);
        }

        .board {
            display: grid;
            gap: 2px;
            background-color: #222;
        }

        .cell {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        /* עיצוב משבצות שחמט */
        .grid-3 .cell:nth-child(odd) { background-color: var(--cell-dark); }
        .grid-3 .cell:nth-child(even) { background-color: var(--cell-light); }
        
        /* תיקון לוח 4x4 */
        .grid-4 .cell:nth-child(8n+1), .grid-4 .cell:nth-child(8n+3), 
        .grid-4 .cell:nth-child(8n+6), .grid-4 .cell:nth-child(8n+8) { background-color: var(--cell-dark); }
        .grid-4 .cell:nth-child(8n+2), .grid-4 .cell:nth-child(8n+4), 
        .grid-4 .cell:nth-child(8n+5), .grid-4 .cell:nth-child(8n+7) { background-color: var(--cell-light); }

        .player-o { color: #2c3e50; }
        .player-x { color: #b22222; }
        .preview { color: rgba(44, 62, 80, 0.4); }

        .status {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <div class="menu-row">
        <button class="btn-size active" id="size3Btn" onclick="changeSize(3)">לוח 3 × 3</button>
        <button class="btn-size" id="size4Btn" onclick="changeSize(4)">לוח 4 × 4</button>
    </div>

    <div class="action-row">
        <button class="btn-reset" id="reset">משחק חדש</button>
        <button class="btn-undo" id="undoBtn" disabled>ביטול מהלך</button>
        <button class="btn-end" id="endTurnBtn" disabled>סיום תור</button>
    </div>

    <div class="game-container">
        <div id="board" class="board grid-3"></div>
    </div>

    <div class="status" id="status">תורך (O)</div>

    <script>
        const boardElement = document.getElementById('board');
        const statusText = document.getElementById('status');
        const undoBtn = document.getElementById('undoBtn');
        const endTurnBtn = document.getElementById('endTurnBtn');
        const resetBtn = document.getElementById('reset');

        let size = 3;
        let boardState = [];
        let currentMove = null;
        let gameOver = false;

        function changeSize(newSize) {
            size = newSize;
            document.getElementById('size3Btn').classList.toggle('active', size === 3);
            document.getElementById('size4Btn').classList.toggle('active', size === 4);
            initGame();
        }

        function initGame() {
            boardState = Array(size * size).fill(null);
            currentMove = null;
            gameOver = false;
            undoBtn.disabled = true;
            endTurnBtn.disabled = true;
            statusText.innerText = "תורך (O)";
            boardElement.className = `board grid-${size}`;
            boardElement.style.gridTemplateColumns = `repeat(${size}, 75px)`;
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            boardState.forEach((cell, index) => {
                const cellDiv = document.createElement('div');
                cellDiv.classList.add('cell');
                
                if (cell) {
                    cellDiv.innerText = cell;
                    cellDiv.classList.add(cell === 'O' ? 'player-o' : 'player-x');
                } else if (index === currentMove) {
                    cellDiv.innerText = 'O';
                    cellDiv.classList.add('preview');
                }
                
                cellDiv.onclick = () => handleCellClick(index);
                boardElement.appendChild(cellDiv);
            });
        }

        function handleCellClick(index) {
            if (gameOver || boardState[index] || currentMove !== null) return;
            currentMove = index;
            undoBtn.disabled = false;
            endTurnBtn.disabled = false;
            renderBoard();
        }

        undoBtn.onclick = () => {
            currentMove = null;
            undoBtn.disabled = true;
            endTurnBtn.disabled = true;
            renderBoard();
        };

        endTurnBtn.onclick = () => {
            boardState[currentMove] = 'O';
            currentMove = null;
            undoBtn.disabled = true;
            endTurnBtn.disabled = true;
            
            if (checkWin('O')) {
                endGame("ניצחת!");
            } else if (boardState.every(c => c !== null)) {
                endGame("תיקו!");
            } else {
                statusText.innerText = "המחשב (X) חושב...";
                setTimeout(aiMove, 600);
            }
            renderBoard();
        };

        function aiMove() {
            if (gameOver) return;
            // בינה מלאכותית: חפש ניצחון, אז חפש חסימה, אז אקראי
            let move = findBestMove('X') || findBestMove('O') || randomMove();
            
            if (move !== null) {
                boardState[move] = 'X';
                if (checkWin('X')) endGame("המחשב ניצח!");
                else if (boardState.every(c => c !== null)) endGame("תיקו!");
                else statusText.innerText = "תורך (O)";
            }
            renderBoard();
        }

        function findBestMove(p) {
            for (let i = 0; i < boardState.length; i++) {
                if (!boardState[i]) {
                    boardState[i] = p;
                    if (checkWin(p)) { boardState[i] = null; return i; }
                    boardState[i] = null;
                }
            }
            return null;
        }

        function randomMove() {
            const avail = boardState.map((v, i) => v === null ? i : null).filter(v => v !== null);
            return avail.length > 0 ? avail[Math.floor(Math.random() * avail.length)] : null;
        }

        function checkWin(p) {
            // שורות ועמודות
            for (let i = 0; i < size; i++) {
                let rCount = 0, cCount = 0;
                for (let j = 0; j < size; j++) {
                    if (boardState[i * size + j] === p) rCount++;
                    if (boardState[j * size + i] === p) cCount++;
                }
                if (rCount === size || cCount === size) return true;
            }
            // אלכסונים
            let d1 = 0, d2 = 0;
            for (let i = 0; i < size; i++) {
                if (boardState[i * size + i] === p) d1++;
                if (boardState[i * size + (size - 1 - i)] === p) d2++;
            }
            return d1 === size || d2 === size;
        }

        function endGame(msg) {
            statusText.innerText = msg;
            gameOver = true;
        }

        resetBtn.onclick = initGame;
        initGame();
    </script>
</body>
</html>
